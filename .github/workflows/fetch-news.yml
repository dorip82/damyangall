# 담양소식 자동 수집을 낮 시간 3시간마다 실행한다 (KST 06·09·12·15·18·21시).
# Vercel Hobby 플랜의 Cron은 하루 1회(vercel.json, 오전 7시)만 가능해서, 더 자주
# 돌리기 위해 GitHub 예약 실행으로 같은 /api/cron/fetch-news 엔드포인트를 호출한다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   SITE_URL     예: https://damyangall.kr
#   CRON_SECRET  Vercel 환경변수 CRON_SECRET과 같은 값
# 둘 중 하나라도 없으면 아무 것도 하지 않고 넘어간다.
name: Fetch news

on:
  schedule:
    - cron: "0 21,0,3,6,9,12 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call cron endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secret이 없어 건너뜁니다."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/fetch-news"
